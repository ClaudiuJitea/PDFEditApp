name: PDFEdit Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m pytest tests/backend -q
      - name: Install desktop dependencies
        run: npm install
      - name: Run desktop tests
        run: npm run test:desktop

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr openssl
      - name: Prepare native tool links
        run: bash build/fetch-native-tools.sh
      - name: Build installers
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          npm install
          npm run build:desktop
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfedit-desktop-linux
          path: dist/desktop/*
